<style>
/* Layout（ツール箱 4番目）: 1カラムの作業画面。上=検索条件、下=結果カード。広い画面では左右2列 */
:root{
  --bg:#f2f4f3; --panel:#ffffff; --ink:#18242c; --muted:#5b6a72; --line:#d5dcdf;
  --accent:#1f6e8c; --accent-ink:#ffffff; --chain1:#b23a48; --chain2:#2d6a4f;
  --chain3:#7a4fb0; --ok:#2d7a3e; --warn:#a86a00; --ng:#b03030; --chip:#e8eef0;
  --font:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181c; --panel:#1b2429; --ink:#e4ebee; --muted:#9aa9b0; --line:#2e3a40;
  --accent:#5fb3d3; --accent-ink:#0d1a20; --chain1:#e2707e; --chain2:#6cc596;
  --chain3:#b593e6; --ok:#6cc58a; --warn:#e0a640; --ng:#ef7a7a; --chip:#25323a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181c; --panel:#1b2429; --ink:#e4ebee; --muted:#9aa9b0; --line:#2e3a40;
  --accent:#5fb3d3; --accent-ink:#0d1a20; --chain1:#e2707e; --chain2:#6cc596;
  --chain3:#b593e6; --ok:#6cc58a; --warn:#e0a640; --ng:#ef7a7a; --chip:#25323a; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  padding:env(safe-area-inset-top,0) max(14px,env(safe-area-inset-right,0px)) 40px max(14px,env(safe-area-inset-left,0px))}
.topwrap{max-width:1100px;margin:0 auto;padding-block:16px 10px;display:flex;flex-direction:column;gap:6px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:14px;min-height:36px;align-self:flex-start}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
header.top{display:flex;gap:12px;align-items:flex-start}
header.top>div{flex:1;min-width:0}
.mark{flex:none;width:40px;height:40px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.mark svg{width:24px;height:24px}
h1{font-size:21px;margin:0;line-height:1.3;text-wrap:balance}
header.top p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:14px}
@media (min-width:900px){.wrap{grid-template-columns:360px 1fr;align-items:start}.side{position:sticky;top:10px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px;min-width:0}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 120px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:9px 12px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;font-size:16px;padding:12px}
button.small{padding:5px 9px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;background:transparent}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.hint{font-size:12px;color:var(--muted)}
.status{font-size:13px;color:var(--muted);display:grid;gap:6px}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.notice{border-left:4px solid var(--warn);background:var(--chip);padding:8px 10px;border-radius:6px;font-size:13px}
.notice.err{border-color:var(--ng)}
.results{display:grid;gap:10px;min-width:0}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.card.t0{border-left:5px solid var(--chain1)}.card.t1{border-left:5px solid var(--chain2)}.card.t2{border-left:5px solid var(--chain3)}
.card h3{margin:0;font-size:16px;line-height:1.35}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;margin-right:6px;vertical-align:2px;color:#fff}
.b0{background:var(--chain1)}.b1{background:var(--chain2)}.b2{background:var(--chain3)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.price{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.price.over{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--chip)}
.chip.ok{color:var(--ok)}.chip.ng{color:var(--ng)}.chip.wa{color:var(--warn)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:13px;text-decoration:none;color:var(--accent);border:1px solid var(--line);border-radius:7px;padding:6px 10px}
.links a.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.plans{font-size:12px;color:var(--muted)}
details summary{cursor:pointer;font-size:13px;color:var(--muted)}
.sites{display:grid;gap:6px}
.site{display:flex;gap:6px;align-items:center}.site span{flex:1;font-size:13px;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
footer{max-width:1100px;margin:16px auto 0;font-size:12px;color:var(--muted)}
footer a{color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(560px,94vw);padding:0}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .panel{border:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="topwrap">
  <a class="back" href="../../index.html">‹ メニュー</a>
  <header class="top">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19V6"/><path d="M3 14h18v5"/><path d="M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="1.8"/></svg></div>
    <div>
      <h1>宿泊先検索</h1>
      <p>現場と日付から、車で30分圏内の空室を楽天トラベルで探します。東横イン・ルートイン・HOTEL AZを優先します。</p>
    </div>
    <button class="small" id="btnSettings" type="button">設定</button>
  </header>
</div>

<div class="wrap">
  <section class="side panel" aria-label="検索条件">
    <label class="f">現場
      <select id="siteSel"></select>
      <span class="hint" id="siteAddr"></span>
    </label>
    <label class="f" id="addrWrap">現場の住所（または「緯度,経度」）

    <div class="row">

      </label>
      <label class="f">泊数

      </label>
    </div>
    <div class="f" style="display:grid;gap:4px">
      <span class="hint" style="font-size:13px">喫煙者（自分を含む）</span>
      <div class="seg" id="smSeg" role="group" aria-label="喫煙者の人数">
        <button type="button" data-n="0">0人</button><button type="button" data-n="1">1人</button><button type="button" data-n="2">2人</button>
      </div>
      <span class="hint" style="font-size:13px;margin-top:6px">禁煙者</span>
      <div class="seg" id="nsSeg" role="group" aria-label="禁煙者の人数">
        <button type="button" data-n="0">0人</button><button type="button" data-n="1">1人</button>
        <button type="button" data-n="2">2人</button><button type="button" data-n="3">3人</button><button type="button" data-n="4">4人</button>
      </div>

    </div>
    <button class="primary" id="btnSearch" type="button">空室を探す</button>
    <div class="row">

      <button type="button" id="btnDemo">サンプル表示</button>
    </div>
    <div class="status" id="status" aria-live="polite">
      <span id="statusText">現場と日付を入れて「空室を探す」を押してください。</span>
      <div class="bar"><i id="barFill"></i></div>
    </div>
  </section>

  <section class="results" aria-label="検索結果">
    <div class="toolbar">
      <div class="hint" id="summary">結果はここに表示されます</div>
      <div class="seg" id="sortSeg" role="group" aria-label="並べ替え" style="min-width:230px">
        <button type="button" data-s="rec" aria-pressed="true">おすすめ</button>
        <button type="button" data-s="dist">近い順</button>
        <button type="button" data-s="price">安い順</button>
      </div>
    </div>
    <div id="notices"></div>
    <div id="list" class="results"><div class="empty">まだ検索していません</div></div>
  </section>
</div>

<footer>
  空室・料金は楽天トラベルの情報です。最終的な空き・料金・部屋タイプは予約画面で確認してください。所要時間は直線距離からの目安です。<br>
  <a href="https://webservice.rakuten.co.jp/" target="_blank" rel="noopener">Supported by Rakuten Developers</a>
</footer>

<dialog id="dlg">
  <div class="panel">
    <h2 style="margin:0;font-size:17px">設定</h2>
    <label class="f">楽天 アプリID（applicationId）
      <input id="sAppId" autocomplete="off">
    </label>
    <label class="f">楽天 アクセスキー（accessKey：pk_で始まる）
      <input id="sKey" autocomplete="off">
    </label>
    <div class="hint">楽天ウェブサービスのアプリ設定の「許可するWebサイト」に、このページのURLを登録してください：<br><span class="mono" id="originTxt"></span></div>
    <div class="row">
      <label class="f">基準料金（1泊）<input type="number" id="sBase" step="500" min="0"></label>
      <label class="f">予算上限（1泊）<input type="number" id="sMax" step="500" min="0"></label>
    </div>
    <div class="row">
      <label class="f">車での上限（分）<input type="number" id="sMin" step="5" min="5"></label>
      <label class="f">平均速度（km/h）<input type="number" id="sSpd" step="5" min="10"></label>
    </div>
    <div class="hint" id="radiusTxt"></div>
    <label class="f">優先チェーン（上から順、1行に1つ。表記ゆれは「|」で区切る）
      <textarea id="sChains"></textarea>
    </label>
    <label class="f">除外キーワード（宿名・プラン名・部屋名に含むものは除外。「|」区切り）

    <div>
      <div class="hint" style="margin-bottom:6px">登録済みの現場</div>
      <div class="sites" id="siteList"></div>
      <div class="row" style="margin-top:8px">
        <input id="newSiteName" placeholder="現場名（例：○○病院）">
        <input id="newSiteAddr" placeholder="住所 または 緯度,経度">
      </div>
      <button type="button" class="small" id="btnAddSite" style="margin-top:6px">現場を追加</button>
    </div>
    <div class="row">
      <button type="button" id="btnReset">初期値に戻す</button>
      <button type="button" class="primary" id="btnSave">保存して閉じる</button>
    </div>
  </div>
</dialog>

<script>
"use strict";
/* ===== 設定 ===== */
const API = "https://openapi.rakuten.co.jp/engine/api/Travel/VacantHotelSearch/20170426";
const GEO = "https://msearch.gsi.go.jp/address-search/AddressSearch?q=";
const CIRCLE_KM = 3;          // 楽天APIの検索半径の上限
const GRID_STEP = 5.0;        // 円の中心間隔(km)。3km円で隙間なく覆う間隔
const ROAD_FACTOR = 1.35;     // 直線距離→道のりの係数
const WAIT_MS = 1100;         // API呼び出し間隔（楽天の目安は1秒1回）
const DEFAULTS = {
  appId:"", key:"", base:8000, max:14000, minutes:30, speed:35,
  chains:"東横イン|東横INN\nルートイン|ROUTE INN|ROUTE-INN\nHOTEL AZ|ホテルAZ|AZホテル|ビジネスホテルAZ",
  excl:"ドミトリー|相部屋|カプセル|ゲストハウス|ホステル|民泊|一棟貸|貸切別荘|コテージ|共同トイレ|トイレ共同|共用トイレ|バス・トイレ共同|バストイレ共同|共同浴場のみ|シャワー共用|バス無|バスなし|トイレなし|女性専用|レディース",
  sites:[], ns:0, sm:1
};
const store = {
  get(){ try{ const v=Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem("genbaYado")||"{}")); if(!/AZ/i.test(v.chains)) v.chains+="\nHOTEL AZ|ホテルAZ|AZホテル|ビジネスホテルAZ"; return v; }catch(e){ return Object.assign({}, DEFAULTS); } },
  set(v){ try{ localStorage.setItem("genbaYado", JSON.stringify(v)); }catch(e){} }
};
let S = store.get();

/* USSグループ オークション会場（USS公式「会場案内」2026年11月時点） */
const USS=[
  {name:"USS 札幌会場",addr:"北海道江別市角山71番地の9"},
  {name:"USS 東北会場",addr:"宮城県柴田郡村田町大字足立字万崎128番地"},
  {name:"USS 群馬会場",addr:"群馬県藤岡市中387番地"},
  {name:"USS 東京会場",addr:"千葉県野田市木間ケ瀬5653番地"},
  {name:"JAA",addr:"東京都江戸川区臨海町3丁目3番3号"},
  {name:"USS 埼玉会場",addr:"埼玉県入間市宮寺3093番地1"},
  {name:"USS 横浜会場",addr:"神奈川県横浜市鶴見区大黒町9番20号"},
  {name:"USS 新潟会場",addr:"新潟県見附市新幸町1番1号"},
  {name:"USS 静岡会場",addr:"静岡県袋井市久能862番地の1"},
  {name:"USS 北陸会場",addr:"石川県白山市湊町カ377番地6"},
  {name:"USS 名古屋会場",addr:"愛知県東海市新宝町507番地の20"},
  {name:"USS-R 名古屋会場",addr:"愛知県東海市新宝町507番地の52"},
  {name:"USS 大阪会場",addr:"大阪府大阪市西淀川区中島二丁目7番106号"},
  {name:"USS 神戸会場",addr:"兵庫県神戸市中央区港島一丁目4番地6"},
  {name:"HAA神戸",addr:"兵庫県神戸市中央区小野浜町21番1号"},
  {name:"USS 岡山会場",addr:"岡山県赤磐市長尾554番地1"},
  {name:"USS 四国会場",addr:"愛媛県松山市北梅本町甲57番地"},
  {name:"USS 福岡会場",addr:"福岡県筑紫野市大字西小田139番地1"},
  {name:"USS 九州会場",addr:"佐賀県鳥栖市酒井西町樋ノ口710番地1"},
  {name:"USS 鹿児島サイト",addr:"鹿児島県鹿児島市南栄4丁目4番"}
];
/* ===== 便利関数 ===== */
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const yen = n => n==null ? "-" : "¥" + Math.round(n).toLocaleString("ja-JP");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function hav(a,b,c,d){const R=6371,r=Math.PI/180;const x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function radiusKm(){ return Math.max(1, S.minutes/60*S.speed/ROAD_FACTOR); }
function driveMin(km){ return Math.round(km*ROAD_FACTOR/S.speed*60); }
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function chainList(){ return S.chains.split(/\n/).map(l=>l.split("|").map(x=>x.trim()).filter(Boolean)).filter(a=>a.length); }
const norm = t => (t||"").normalize("NFKC").toUpperCase().replace(/[\s・\-]/g,"");
function chainTier(name){ const n=norm(name); const cl=chainList();
  for(let i=0;i<cl.length;i++){ if(cl[i].some(k=>n.includes(norm(k)))) return i; } return 99; }
/* 公式サイト：ホテル名で公式ドメイン内を検索して開く */
const OFFICIAL=[{re:/東横/,site:"toyoko-inn.com",label:"東横イン公式"},{re:/ルートイン|ROUTEINN/,site:"route-inn.co.jp",label:"ルートイン公式"},{re:/HOTELAZ|ホテルAZ|AZホテル/,site:"",label:"HOTEL AZ公式"}];
function official(name){ const n=norm(name); const o=OFFICIAL.find(x=>x.re.test(n)); if(!o) return null;
  const q=(name||"").normalize("NFKC")+(o.site?" site:"+o.site:" 公式サイト");
  return {label:o.label, url:"https://www.google.com/search?btnI=1&q="+encodeURIComponent(q)}; }
function exclRe(){ const w=S.excl.split("|").map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")); return w.length? new RegExp(w.join("|"),"i") : null; }
function smokeType(t){ t=(t||"").normalize("NFKC"); const s=/喫煙/.test(t.replace(/禁煙|非喫煙|分煙/g,"")); const n=/禁煙|非喫煙/.test(t); return s&&!n?"smoke":n&&!s?"non":"?"; }

/* 六角格子で、検索半径内を3km円で覆う中心点 */
function gridPoints(lat,lng,R){
  const pts=[[lat,lng]]; const kmLat=1/110.574, kmLng=1/(111.320*Math.cos(lat*Math.PI/180));
  const dy=GRID_STEP*Math.sqrt(3)/2; const n=Math.ceil((R+CIRCLE_KM)/dy)+1;
  for(let j=-n;j<=n;j++){ for(let i=-n;i<=n;i++){
    const x=(i+(j%2?0.5:0))*GRID_STEP, y=j*dy; if(i===0&&j===0) continue;
    if(Math.hypot(x,y) <= R + CIRCLE_KM*0.6) pts.push([lat+y*kmLat, lng+x*kmLng]);
  }}
  return pts.sort((a,b)=>hav(lat,lng,a[0],a[1])-hav(lat,lng,b[0],b[1]));
}

/* ===== 通信 ===== */
let mode="fetch", abortFlag=false, lastErr=null;
class ApiErr extends Error{ constructor(code,msg,status){ super(msg); this.code=code; this.status=status; } }
function jsonp(url){ return new Promise((res,rej)=>{
  const cb="__rk"+Date.now()+Math.floor(Math.random()*1e6); const sc=document.createElement("script");
  const t=setTimeout(()=>{cleanup();rej(new ApiErr("timeout","応答がありません"));},15000);
  function cleanup(){clearTimeout(t);delete window[cb];sc.remove();}
  window[cb]=d=>{cleanup();res(d);};
  sc.onerror=()=>{cleanup();rej(new ApiErr("jsonp","取得できませんでした（該当なしの場合も含む）"));};
  sc.src=url+"&callback="+cb; document.head.appendChild(sc);
});}
async function rakuten(params){
  const q=new URLSearchParams(Object.assign({format:"json",applicationId:S.appId,accessKey:S.key,datumType:"1"},params));
  const url=API+"?"+q.toString();
  for(let attempt=0;attempt<3;attempt++){
    let data, status=200;
    if(mode==="fetch"){
      try{ const r=await fetch(url,{referrerPolicy:"origin"}); status=r.status; data=await r.json().catch(()=>({})); }
      catch(e){ mode="jsonp"; }
    }
    if(mode==="jsonp"){
      try{ data=await jsonp(url); }catch(e){ if(e.code==="jsonp") return {hotels:[],_jsonpMiss:true}; throw e; }
    }
    if(data && data.error){
      if(data.error==="not_found") return {hotels:[]};
      if(status===429||data.error==="too_many_requests"){ await sleep(2000*(attempt+1)); continue; }
      throw new ApiErr(data.error, data.error_description||data.error, status);
    }
    if(status>=500){ await sleep(1500); continue; }
    return data||{hotels:[]};
  }
  throw new ApiErr("busy","楽天APIが混み合っています。少し待って再検索してください。");
}
async function geocode(text){
  const m=text.trim().match(/^(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)$/);
  if(m) return {lat:+m[1], lng:+m[2], label:"座標 "+m[1]+", "+m[2]};
  const r=await fetch(GEO+encodeURIComponent(text)); const a=await r.json();
  if(!a||!a.length) throw new ApiErr("geo","住所から位置を特定できませんでした。番地まで入れるか、「緯度,経度」で入力してください。");
  const c=a[0].geometry.coordinates; return {lat:c[1], lng:c[0], label:a[0].properties.title};
}

/* ===== 結果の組み立て ===== */
function absorb(map, data, site, tag){
  for(const h of (data.hotels||[])){
    const blocks=h.hotel||h; let basic=null; const plans=[];
    for(const b of blocks){
      if(b.hotelBasicInfo) basic=b.hotelBasicInfo;
      if(b.roomInfo){ let cur=null;
        for(const r of b.roomInfo){
          if(r.roomBasicInfo){ const x=r.roomBasicInfo;
            cur={planId:x.planId, planName:x.planName||"", roomName:x.roomName||"", reserveUrl:x.reserveUrl,
                 bf:x.withBreakfastFlag===1||x.breakfastSelectFlag===1, price:null}; plans.push(cur); }
          if(r.dailyCharge && cur){ const d=r.dailyCharge; cur.price = d.total ?? d.rakutenCharge; }
        }}
    }
    if(!basic) continue;
    let H=map.get(basic.hotelNo);
    if(!H){ H={no:basic.hotelNo, name:basic.hotelName, url:basic.hotelInformationUrl, planUrl:basic.planListUrl,
      lat:+basic.latitude, lng:+basic.longitude, addr:(basic.address1||"")+(basic.address2||""), tel:basic.telephoneNo,
      parking:basic.parkingInformation||"", access:basic.access||"", review:basic.reviewAverage, plans:new Map(), tags:new Set()};
      H.km=hav(site.lat,site.lng,H.lat,H.lng); H.tier=chainTier(H.name); map.set(basic.hotelNo,H); }
    for(const p of plans){ const k=p.planId+"|"+p.roomName; if(!H.plans.has(k)) H.plans.set(k,p); }
    if(tag) H.tags.add(tag);
  }
}
function finalize(map, R, needBf){
  const re=exclRe(); const out=[];
  for(const H of map.values()){
    if(!(H.km<=R)) continue;
    if(re && re.test(H.name)) continue;
    let plans=[...H.plans.values()].filter(p=>!(re && re.test(p.planName+" "+p.roomName)));
    if(needBf) plans=plans.filter(p=>p.bf);
    plans=plans.filter(p=>p.price==null||p.price<=S.max);
    if(!plans.length) continue;
    plans.sort((a,b)=>(a.price??1e9)-(b.price??1e9));
    const smoke=plans.filter(p=>smokeType(p.planName+" "+p.roomName)==="smoke");
    const non=plans.filter(p=>smokeType(p.planName+" "+p.roomName)==="non");
    out.push(Object.assign({}, H, {okPlans:plans, best:plans[0], smoke, non,
      min:driveMin(H.km), noParking:/無し|なし|無|ございません|ありません/.test(H.parking)&&!/有|あり/.test(H.parking)}));
  }
  return out;
}

/* ===== 画面 ===== */
let results=[], sortKey="rec", ctx=null;
function sortResults(){
  const f={
    rec:(a,b)=>a.tier-b.tier || ((a.best.price>S.base)-(b.best.price>S.base)) || a.min-b.min || a.best.price-b.best.price,
    dist:(a,b)=>a.km-b.km, price:(a,b)=>(a.best.price??1e9)-(b.best.price??1e9)}[sortKey];
  results.sort(f);
}
function render(){
  sortResults(); const L=$("list");
  if(!results.length){ L.innerHTML='<div class="empty">条件に合う空室は見つかっていません</div>'; return; }
  const cl=chainList();
  L.innerHTML=results.map(h=>{
    const p=h.best, over=p.price>S.base;
    const badge=h.tier<99?`<span class="badge b${Math.min(h.tier,2)}">${esc(cl[h.tier][0])}</span>`:"";
    let sm="";
    if(ctx && ctx.sm>0) sm = h.smoke.length ? `<span class="chip ok">喫煙プランあり${ctx.sm>1?`（${ctx.sm}室は予約画面で確認）`:""}</span>` : '<span class="chip wa">喫煙は要確認</span>';
    let nsChip="";
    if(ctx && ctx.ns>0){
      const m=h.nsMax;
      if(m==null) nsChip='<span class="chip wa">禁煙室 未確認</span>';
      else if(m>=ctx.ns) nsChip=`<span class="chip ok">禁煙${ctx.ns}室OK（禁煙者${ctx.ns}名とも宿泊可）</span>`;
      else if(m>0) nsChip=`<span class="chip wa">禁煙は${m}室まで（禁煙者${m}名なら宿泊可）</span>`;
      else nsChip='<span class="chip ng">禁煙室の空きなし</span>';
    }
    const bf=p.bf?'<span class="chip ok">朝食付き</span>':'<span class="chip wa">朝食なし</span>';
    const park=h.parking?(h.noParking?'<span class="chip ng">駐車場なし</span>':'<span class="chip">駐車場あり</span>'):'<span class="chip wa">駐車場 不明</span>';
    const route=`https://www.google.com/maps/dir/?api=1&origin=${h.lat},${h.lng}&destination=${ctx.site.lat},${ctx.site.lng}&travelmode=driving`;
    const coin=`https://www.google.com/maps/search/%E3%82%B3%E3%82%A4%E3%83%B3%E3%83%91%E3%83%BC%E3%82%AD%E3%83%B3%E3%82%B0/@${h.lat},${h.lng},16z`;
    const book=p.reserveUrl||h.planUrl||h.url; const off=official(h.name);
    const others=h.okPlans.slice(0,8).map(x=>`<li>${esc(x.planName)}${x.roomName?"／"+esc(x.roomName):""}：${yen(x.price)}${x.bf?"（朝食）":""}</li>`).join("");
    return `<article class="card ${h.tier<=2?"t"+h.tier:""}">
      <h3>${badge}${esc(h.name)}</h3>
      <div class="meta"><span>現場まで <b>${h.km.toFixed(1)}km</b>（車 約${h.min}分）</span>${h.review?`<span>評価 <b>${(+h.review).toFixed(2)}</b></span>`:""}</div>
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="price ${over?"over":""}">${yen(p.price)}</span><span class="hint">1泊・最安の該当プラン${over?`（基準${yen(S.base)}超え）`:""}</span></div>
      <div class="chips">${bf}${sm}${nsChip}${park}</div>
      ${h.parking?`<div class="plans">駐車場：${esc(h.parking)}</div>`:""}
      <div class="links">
        ${off?`<a class="main" href="${esc(off.url)}" target="_blank" rel="noopener">${off.label}で予約</a><a href="${esc(book)}" target="_blank" rel="noopener">楽天で見る</a>`
             :`<a class="main" href="${esc(book)}" target="_blank" rel="noopener">楽天で予約</a><a href="${esc(h.url)}" target="_blank" rel="noopener">宿の詳細</a>`}
        <a href="${route}" target="_blank" rel="noopener">現場までのルート</a>
        ${(h.noParking||!h.parking)?`<a href="${coin}" target="_blank" rel="noopener">近くのコインパーキング</a>`:""}
      </div>
      <details><summary>該当プラン ${h.okPlans.length}件・住所・電話</summary>
        <ul class="plans" style="padding-left:18px;margin:6px 0">${others}</ul>
        <div class="plans">${esc(h.addr)}<br>電話：<span class="mono">${esc(h.tel||"-")}</span></div>
      </details>
    </article>`;
  }).join("");
}
function setStatus(t,frac){ $("statusText").textContent=t; if(frac!=null) $("barFill").style.width=Math.round(frac*100)+"%"; }
function notice(html,err){ const d=document.createElement("div"); d.className="notice"+(err?" err":""); d.innerHTML=html; $("notices").appendChild(d); }
function summary(){
  const c=i=>results.filter(r=>r.tier===i).length;
  $("summary").textContent=`${ctx.site.label}／${ctx.checkin} から${ctx.nights}泊：${results.length}軒（東横イン${c(0)}・ルートイン${c(1)}・AZ${c(2)}）`;
}

/* ===== 検索本体 ===== */
async function search(){
  if(!S.appId||!S.key){ openSettings(); notice("最初に設定で楽天のアプリIDとアクセスキーを入れてください。",true); return; }
  const text=currentAddr(); if(!text){ setStatus("現場の住所を入れてください。"); return; }
  const checkin=$("checkin").value; if(!checkin){ setStatus("チェックイン日を選んでください。"); return; }
  const nights=+$("nights").value; const co=new Date(checkin); co.setDate(co.getDate()+nights);
  $("notices").innerHTML=""; results=[]; render(); abortFlag=false; mode="fetch";
  $("btnSearch").disabled=true; $("btnStop").disabled=false;
  try{
    setStatus("現場の位置を調べています…",0);
    const site=await geocode(text);
    const R=radiusKm(); const pts=gridPoints(site.lat,site.lng,R);
    ctx={site, checkin, checkout:ymd(co), nights, ns:S.ns, sm:S.sm};
    if(S.ns+S.sm===0){ setStatus("人数を1人以上にしてください。"); return; }
    const base={checkinDate:checkin, checkoutDate:ctx.checkout, adultNum:"1", roomNum:"1", maxCharge:String(S.max),
                searchRadius:String(CIRCLE_KM), hits:"30"};
    let needBf=true, map=new Map(), misses=0;
    const sweep=async(extra,label)=>{
      for(let i=0;i<pts.length;i++){
        if(abortFlag) return;
        setStatus(`${label}（${i+1}/${pts.length}）`, (i+1)/pts.length);
        for(let page=1;page<=3;page++){
          const d=await rakuten(Object.assign({},base,extra,{latitude:pts[i][0].toFixed(6),longitude:pts[i][1].toFixed(6),page:String(page)}));
          if(d._jsonpMiss) misses++;
          absorb(map,d,site);
          results=finalize(map,R,needBf); render(); summary();
          await sleep(WAIT_MS);
          if(!d.pagingInfo || page>=d.pagingInfo.pageCount) break;
        }
      }
    };
    const kin = S.sm===0 ? ",kinen" : "";   /* 全員禁煙なら最初から禁煙室で絞る */
    await sweep({squeezeCondition:"breakfast"+kin}, "朝食付きの空室を検索中");
    if(!abortFlag && !results.length){
      notice("朝食付きで条件に合う空室がなかったため、朝食なしも含めて探しています。");
      needBf=false; map=new Map(); await sweep(kin?{squeezeCondition:"kinen"}:{}, "朝食なしも含めて検索中");
    }
    if(!abortFlag && S.ns>0 && results.length) await checkNonSmoking(needBf);
    if(misses && misses===countCalls(pts) && !results.length)
      notice(`楽天APIから応答を受け取れませんでした。設定のアプリID・アクセスキーと、楽天側の「許可するWebサイト」に <span class="mono">${esc(location.origin)}</span> が登録されているか確認してください。`,true);
    setStatus(abortFlag?"中止しました。":`検索完了：${results.length}軒`,1);
  }catch(e){
    let msg=e.message;
    if(e.status===403||/referr|origin|ip_not|not_allowed/i.test(e.code+msg))
      msg=`楽天APIが接続を拒否しました（${esc(e.code)}）。楽天ウェブサービスのアプリ設定で、許可するWebサイトに <span class="mono">${esc(location.origin)}</span> を登録してください。IP制限は空欄にしてください。`;
    else if(e.status===401||/wrong_parameter|invalid/i.test(e.code)) msg=`楽天APIの設定エラー：${esc(e.message)}。アプリIDとアクセスキーを確認してください。`;
    notice(msg,true); setStatus("エラーで止まりました。");
  }finally{ $("btnSearch").disabled=false; $("btnStop").disabled=true; }
}
function countCalls(pts){ return pts.length; }

/* 禁煙の同行者分：1室→2室→3室と順に、何室まで取れるかを確認 */
async function checkNonSmoking(needBf){
  const cand=results.slice().sort((a,b)=>a.tier-b.tier||a.min-b.min).slice(0,45);
  let alive=cand.map(h=>h.no); const total=ctx.ns*Math.ceil(cand.length/15); let done=0;
  for(let n=1;n<=ctx.ns && alive.length;n++){
    const passed=[];
    for(let i=0;i<alive.length;i+=15){
      if(abortFlag) return;
      const chunk=alive.slice(i,i+15); done++;
      setStatus(`禁煙室が何室取れるか確認中（${n}室）…`, Math.min(1,done/total));
      const p={checkinDate:ctx.checkin, checkoutDate:ctx.checkout, adultNum:"1", roomNum:String(n),
        maxCharge:String(S.max), hotelNo:chunk.join(","), squeezeCondition:needBf?"kinen,breakfast":"kinen", hits:"30"};
      try{
        const d=await rakuten(p); if(d._jsonpMiss) throw 0;
        const ok=new Set(); for(const h of (d.hotels||[])){ const b=(h.hotel||h).find(x=>x.hotelBasicInfo); if(b) ok.add(b.hotelBasicInfo.hotelNo); }
        for(const no of chunk){ const r=results.find(x=>x.no===no); if(!r) continue;
          if(ok.has(no)){ r.nsMax=n; passed.push(no); } else if(n===1) r.nsMax=0; }
      }catch(e){ /* 確認できなかった宿は直前の結果のまま */ }
      render(); await sleep(WAIT_MS);
    }
    alive=passed;
  }
}

  ctx={site, checkin:$("checkin").value||ymd(new Date()), checkout:"", nights:+$("nights").value, ns:S.ns, sm:S.sm};

    {roomInfo:[{roomBasicInfo:{planId:1,planName:(smoke?"【喫煙】":"【禁煙】")+"シングル 朝食無料",roomName:"シングル",withBreakfastFlag:bf?1:0,reserveUrl:"https://travel.rakuten.co.jp/"}},{dailyCharge:{total:price}},
               {roomBasicInfo:{planId:2,planName:"【禁煙】シングル 朝食無料",roomName:"シングル",withBreakfastFlag:bf?1:0,reserveUrl:"https://travel.rakuten.co.jp/"}},{dailyCharge:{total:price+300}}]}]});
  const data={hotels:[

    mk(4,"サンプルシティホテル（架空）",0.05,0.09,12800,true,"有り 1泊1000円",true),
    mk(5,"ＨＯＴＥＬ　ＡＺ　サンプル店（架空）",-0.06,-0.04,6500,true,"有り 無料",true)]};

  $("notices").innerHTML=""; notice("これは画面確認用の架空データです。実際の空室ではありません。");
  render(); summary(); setStatus("サンプルを表示しました。",1);

/* ===== 現場リスト・設定 ===== */
function currentAddr(){ const v=$("siteSel").value; if(v==="__free") return $("addr").value.trim();
  const [k,i]=v.split(":"); const s=(k==="uss"?USS:S.sites)[+i]; return s?s.addr:""; }
function fillSites(){
  const sel=$("siteSel"); const keep=sel.value;
  sel.innerHTML='<option value="__free">住所を直接入力</option>'
    +(S.sites.length?'<optgroup label="登録した現場">'+S.sites.map((s,i)=>`<option value="my:${i}">${esc(s.name)}</option>`).join("")+'</optgroup>':"")
    +'<optgroup label="USSオークション会場">'+USS.map((s,i)=>`<option value="uss:${i}">${esc(s.name)}</option>`).join("")+'</optgroup>';
  const want=keep||S.lastSite; if(want && [...sel.options].some(o=>o.value===want)) sel.value=want;
  $("addrWrap").hidden = sel.value!=="__free";
  $("siteList").innerHTML = S.sites.length? S.sites.map((s,i)=>`<div class="site"><span><b>${esc(s.name)}</b><br>${esc(s.addr)}</span><button type="button" class="small" data-del="${i}">削除</button></div>`).join("") : '<div class="hint">まだありません。USS会場は最初から選べます。よく行く病院などを登録しておくと、選ぶだけで検索できます。</div>';
}
function openSettings(){
  $("sAppId").value=S.appId; $("sKey").value=S.key; $("sBase").value=S.base; $("sMax").value=S.max;
  $("sMin").value=S.minutes; $("sSpd").value=S.speed; $("sChains").value=S.chains; $("sExcl").value=S.excl;
  $("originTxt").textContent=location.origin+"/"; updRadius(); fillSites();
  try{ $("dlg").showModal(); }catch(e){ $("dlg").setAttribute("open",""); }
}
function updRadius(){ const m=+$("sMin").value||30, v=+$("sSpd").value||35; $("radiusTxt").textContent=`→ 現場から直線 約${(m/60*v/ROAD_FACTOR).toFixed(1)}km 以内を検索します（道のり係数${ROAD_FACTOR}）。`; }
function readSettings(){
  S.appId=$("sAppId").value.trim(); S.key=$("sKey").value.trim();
  S.base=+$("sBase").value||DEFAULTS.base; S.max=+$("sMax").value||DEFAULTS.max;
  S.minutes=+$("sMin").value||DEFAULTS.minutes; S.speed=+$("sSpd").value||DEFAULTS.speed;
  S.chains=$("sChains").value.trim()||DEFAULTS.chains; S.excl=$("sExcl").value.trim();
}
$("btnSettings").onclick=openSettings;
$("btnSave").onclick=()=>{ readSettings(); store.set(S); $("dlg").close(); fillSites(); if(results.length){ render(); } };
$("btnReset").onclick=()=>{ const keep={appId:S.appId,key:S.key,sites:S.sites,ns:S.ns,sm:S.sm}; S=Object.assign({},DEFAULTS,keep); openSettings(); };
$("sMin").oninput=$("sSpd").oninput=updRadius;
$("btnAddSite").onclick=()=>{ const n=$("newSiteName").value.trim(), a=$("newSiteAddr").value.trim(); if(!n||!a) return;
  readSettings(); S.sites.push({name:n,addr:a}); store.set(S); $("newSiteName").value=$("newSiteAddr").value=""; fillSites(); };
$("siteList").onclick=e=>{ const i=e.target.dataset.del; if(i==null) return; readSettings(); S.sites.splice(+i,1); store.set(S); fillSites(); };
$("siteSel").onchange=()=>{ $("addrWrap").hidden = $("siteSel").value!=="__free"; S.lastSite=$("siteSel").value; store.set(S); showSiteAddr(); };
function showSiteAddr(){ const v=$("siteSel").value; $("siteAddr").textContent = v==="__free" ? "" : currentAddr(); }
function party(){ [...$("nsSeg").children].forEach(b=>b.setAttribute("aria-pressed", String(+b.dataset.n===S.ns)));
  [...$("smSeg").children].forEach(b=>b.setAttribute("aria-pressed", String(+b.dataset.n===S.sm)));
  $("partyTxt").textContent=`合計${S.sm+S.ns}名：喫煙室${S.sm}室＋禁煙室${S.ns}室（1人1室）`; store.set(S); }
function setNs(n){ S.ns=n; party(); }
$("nsSeg").onclick=e=>{ if(e.target.dataset.n!=null) setNs(+e.target.dataset.n); };
$("smSeg").onclick=e=>{ if(e.target.dataset.n!=null){ S.sm=+e.target.dataset.n; party(); } };
$("sortSeg").onclick=e=>{ const s=e.target.dataset.s; if(!s) return; sortKey=s; [...$("sortSeg").children].forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.s===s))); if(results.length) render(); };
$("btnSearch").onclick=search;
$("btnStop").onclick=()=>{ abortFlag=true; };
$("btnDemo").onclick=demo;

/* 初期化 */
(function(){ const t=new Date(); $("checkin").value=ymd(t); fillSites(); S.ns=Math.min(4,S.ns||0); S.sm=(S.sm==null?1:S.sm); party();
  $("addrWrap").hidden=$("siteSel").value!=="__free"; showSiteAddr(); })();
